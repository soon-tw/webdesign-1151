<script>
/* 預覽專用相容層：用 file:// 開檔時 Chrome 不允許 history.pushState（origin 是 null），
   Angular 的路由會直接丟 SecurityError。這裡在它失敗時退回只改 location.hash，
   讓 #/home 這種網址在雙擊開檔的情況下也能運作。用伺服器開時這段不會生效。 */
(function () {
  if (location.protocol !== 'file:') return;
  function fallback(url, replace) {
    var s = String(url == null ? '' : url);
    var i = s.indexOf('#');
    var frag = i >= 0 ? s.slice(i) : '';
    var base = location.href.split('#')[0];
    try {
      if (replace) location.replace(base + frag);
      else location.hash = frag || '#';
    } catch (e) { /* 真的不行就放棄，不要讓整個 App 掛掉 */ }
  }
  var push = history.pushState, repl = history.replaceState;
  history.pushState = function (st, ti, url) {
    try { push.call(history, st, ti, url); } catch (e) { fallback(url, false); }
  };
  history.replaceState = function (st, ti, url) {
    try { repl.call(history, st, ti, url); } catch (e) { fallback(url, true); }
  };
})();
</script>
