<script>
const steps = JSON.parse(document.getElementById('data').textContent);
let cur = 0, tab = 0;
const $ = s => document.querySelector(s);

function render() {
  const st = steps[cur];
  $('#pos').textContent = '第 ' + (cur + 1) + ' 步／共 ' + steps.length + ' 步';
  $('#howTitle').textContent = st.title;
  $('#howBody').textContent = st.desc;
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === steps.length - 1;
  document.querySelectorAll('#stepList button').forEach((b, i) => b.classList.toggle('active', i === cur));

  if (tab >= st.files.length) tab = 0;
  $('#tabs').innerHTML = st.files.map((f, i) =>
    '<button data-tab="' + i + '" class="' + (i === tab ? 'on' : '') + '">' + f.name + '</button>').join('');
  $('#tabs').querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => { tab = +b.dataset.tab; render(); });
  });
  $('#fname').textContent = st.files[tab].name;
  $('#code').textContent = st.files[tab].code;

  $('#preview').src = st.preview;
  $('#ppath').textContent = st.preview;
  $('#status').textContent = '';
}

document.querySelectorAll('#stepList button').forEach(b => {
  b.addEventListener('click', () => { cur = +b.dataset.step - 1; tab = 0; render(); });
});
$('#prev').addEventListener('click', () => { if (cur > 0) { cur--; tab = 0; render(); } });
$('#next').addEventListener('click', () => { if (cur < steps.length - 1) { cur++; tab = 0; render(); } });
$('#reload').addEventListener('click', () => { const f = $('#preview'); f.src = f.src; });
$('#open').addEventListener('click', () => { window.open(steps[cur].preview, '_blank', 'noopener'); });
$('#copy').addEventListener('click', async () => {
  const code = steps[cur].files[tab].code;
  const name = steps[cur].files[tab].name;
  // file:// 下沒有 navigator.clipboard，退回 execCommand
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(code);
    } else {
      const ta = document.createElement('textarea');
      ta.value = code; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (!ok) throw new Error('copy failed');
    }
    $('#status').textContent = '已複製 ' + name;
  } catch (e) { $('#status').textContent = '複製失敗，請手動選取程式碼'; }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowLeft' && cur > 0) { cur--; tab = 0; render(); }
  if (e.key === 'ArrowRight' && cur < steps.length - 1) { cur++; tab = 0; render(); }
});
render();
</script>
