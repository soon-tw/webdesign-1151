\n    { id: 2, name: '拉麵', price: 120, stock: 3, tags: ['主食'] },\n    { id: 3, name: '水餃', price: 60, stock: 0, tags: ['點心', '特價'] },\n    { id: 4, name: '紅茶', price: 30, stock: 40, tags: ['飲料'] },\n  ];\n  applyDiscount(off: number): Discounted[] {\n    return this.products.map((p) => ({\n      ...p, finalPrice: Math.round(p.price * off),\n    }));\n  }\n}\nconst svc = new ProductService();\nconst list = document.querySelector('#list') as HTMLElement;\nconst result = document.querySelector('#result') as HTMLElement;\nconst discounted = svc.applyDiscount(0.9);\nlist.innerHTML = '';\ndiscounted.forEach((p) => {\n  const li = document.createElement('li');\n  li.textContent = `${p.name}：${p.price} → ${p.finalPrice}`;\n  list.appendChild(li);\n});\nresult.textContent = `原價 ${svc.products[0].price} 元未變動，共 ${discounted.length} 筆`;\n// 用到：交叉型別 &、map、展開運算子、不變性", "runjs": "class ProductService {\n  products = [\n    { id: 1, name: '炒飯', price: 80, stock: 12, tags: ['主食', '特價'] },\n    { id: 2, name: '拉麵', price: 120, stock: 3, tags: ['主食'] },\n    { id: 3, name: '水餃', price: 60, stock: 0, tags: ['點心', '特價'] },\n    { id: 4, name: '紅茶', price: 30, stock: 40, tags: ['飲料'] },\n  ];\n  applyDiscount(off) {\n    return this.products.map((p) => ({\n      ...p, finalPrice: Math.round(p.price * off),\n    }));\n  }\n}\nconst svc = new ProductService();\nconst list = document.querySelector('#list');\nconst result = document.querySelector('#result');\nconst discounted = svc.applyDiscount(0.9);\nlist.innerHTML = '';\ndiscounted.forEach((p) => {\n  const li = document.createElement('li');\n  li.textContent = `${p.name}：${p.price} → ${p.finalPrice}`;\n  list.appendChild(li);\n});\nresult.textContent = `原價 ${svc.products[0].price} 元未變動，共 ${discounted.length} 筆`;", "html": "<div class=\"wrap\"><div class=\"card\"><h1>商品套用折扣（9 折）<\/h1><ul id=\"list\"><\/ul><div class=\"result\" id=\"result\">計算中…<\/div><\/div><\/div>", "css": "", "doc": "<!doctype html><html lang=\"zh-TW\"><head><meta chars <script>
const steps=JSON.parse(document.getElementById('data').textContent);
let current=0;
const qs=s=>document.querySelector(s);
const buttons=[...document.querySelectorAll('#stepList [data-i]')];
function show(i){
  current=Math.max(0,Math.min(i,steps.length-1));
  const s=steps[current];
  buttons.forEach((b,n)=>b.classList.toggle('active',n===current));
  qs('#tsCode').textContent=s.ts||'（這一步還沒有 TypeScript）';
  qs('#htmlCode').textContent=s.html;
  qs('#cssCode').textContent=s.css||'/* 本題樣式已準備好 */';
  qs('#preview').srcdoc=s.doc;
  qs('#pos').textContent='第 '+(current+1)+' 步／共 '+steps.length+' 步';
  qs('#howTitle').textContent='第 '+(current+1)+' 步｜'+s.title;
  qs('#howBody').textContent=s.desc;
  qs('#status').textContent='目前顯示第 '+(current+1)+' 步（'+(current+1)+' / '+steps.length+'）';
  qs('#prev').disabled=current===0;
  qs('#next').disabled=current===steps.length-1;
}
buttons.forEach(b=>b.addEventListener('click',()=>show(Number(b.dataset.i))));
qs('#prev').addEventListener('click',()=>show(current-1));
qs('#next').addEventListener('click',()=>show(current+1));
qs('#reload').addEventListener('click',()=>{const f=qs('#preview');f.srcdoc='';f.srcdoc=steps[current].doc;});
qs('#open').addEventListener('click',()=>{const w=open();if(w){w.document.open();w.document.write(steps[current].doc);w.document.close();}});
qs('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(steps[current].ts);qs('#status').textContent='已複製 TypeScript（可貼到 StackBlitz 的 service）';}catch(e){qs('#status').textContent='複製失敗，請手動全選程式碼';}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable=true]'))return;if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1);});
show(0);
</script>
</body></html>
