nconst run = document.querySelector('#run') as HTMLElement;\nfunction render(tag: string): void {\n  const names = svc.namesByTag(tag);\n  list.innerHTML = '';\n  names.forEach((n) => {\n    const li = document.createElement('li');\n    li.textContent = n;\n    list.appendChild(li);\n  });\n  result.textContent = names.length ? `找到 ${names.length} 筆` : '沒有符合的商品';\n}\nrun.addEventListener('click', () => render(input.value));\nrender('特價');\n// 用到：class 方法、filter、map、includes、string[]", "runjs": "class ProductService {\n  products = [\n    { id: 1, name: '炒飯', price: 80, stock: 12, tags: ['主食', '特價'] },\n    { id: 2, name: '拉麵', price: 120, stock: 3, tags: ['主食'] },\n    { id: 3, name: '水餃', price: 60, stock: 0, tags: ['點心', '特價'] },\n    { id: 4, name: '紅茶', price: 30, stock: 40, tags: ['飲料'] },\n  ];\n  namesByTag(tag) {\n    return this.products\n      .filter((p) => p.tags.includes(tag))\n      .map((p) => p.name);\n  }\n}\nconst svc = new ProductService();\nconst list = document.querySelector('#list');\nconst result = document.querySelector('#result');\nconst input = document.querySelector('#tag');\nconst run = document.querySelector('#run');\nfunction render(tag) {\n  const names = svc.namesByTag(tag);\n  list.innerHTML = '';\n  names.forEach((n) => {\n    const li = document.createElement('li');\n    li.textContent = n;\n    list.appendChild(li);\n  });\n  result.textContent = names.length ? `找到 ${names.length} 筆` : '沒有符合的商品';\n}\nrun.addEventListener('click', () => render(input.value));\nrender('特價');", "html": "<div class=\"wrap\"><div class=\"card\"><h1>依標籤篩選商品<\/h1><input id=\"tag\" value=\"特價\"><button id=\"run\">篩選<\/button><ul id=\"list\"><\/ul><div class=\"result\" id=\"result\">等待篩選<\/div><\/div><\/div>", "css": "", "doc": "<!doctype html><html lang=\"zh-TW\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>練習 2｜依標籤篩選商品（基礎）<\/title><style>body{font-family:\"PingFang TC\",\"Microsoft JhengHei\", t.value));\nrender('特價');<\/script><\/body><\/html>"}]</script>
<script>
const steps=JSON.parse(document.getElementById('data').textContent);
let current=0;
const qs=s=>document.querySelector(s);
const buttons=[...document.querySelectorAll('#stepList [data-i]')];
function show(i){
  current=Math.max(0,Math.min(i,steps.length-1));
  const s=steps[current];
  buttons.forEach((b,n)=>b.classList.toggle('active',n===current));
  qs('#tsCode').textContent=s.ts||'（這一步還沒有 TypeScript）';
  qs('#htmlCode').textContent=s.html;
  qs('#cssCode').textContent=s.css||'/* 本題樣式已準備好 */';
  qs('#preview').srcdoc=s.doc;
  qs('#pos').textContent='第 '+(current+1)+' 步／共 '+steps.length+' 步';
  qs('#howTitle').textContent='第 '+(current+1)+' 步｜'+s.title;
  qs('#howBody').textContent=s.desc;
  qs('#status').textContent='目前顯示第 '+(current+1)+' 步（'+(current+1)+' / '+steps.length+'）';
  qs('#prev').disabled=current===0;
  qs('#next').disabled=current===steps.length-1;
}
buttons.forEach(b=>b.addEventListener('click',()=>show(Number(b.dataset.i))));
qs('#prev').addEventListener('click',()=>show(current-1));
qs('#next').addEventListener('click',()=>show(current+1));
qs('#reload').addEventListener('click',()=>{const f=qs('#preview');f.srcdoc='';f.srcdoc=steps[current].doc;});
qs('#open').addEventListener('click',()=>{const w=open();if(w){w.document.open();w.document.write(steps[current].doc);w.document.close();}});
qs('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(steps[current].ts);qs('#status').textContent='已複製 TypeScript（可貼到 StackBlitz 的 service）';}catch(e){qs('#status').textContent='複製失敗，請手動全選程式碼';}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable=true]'))return;if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1);});
show(0);
</script>
</body></html>
